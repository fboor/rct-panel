<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="DejaVu Sans, sans-serif">
  <!-- Kantenansicht, gleiche Sicht wie Bild 1 (Rueckseitenansicht). Zeigt, was
       ein Foto schlecht zeigte: wie die beiden Seitenkanten zu bedienen sind.
       Bewusst keine Kapitelverweise in der Grafik. -->
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6b7a"/>
    </marker>
  </defs>

  <text x="30" y="40" fill="#0b3d6b" font-size="24" font-weight="700">Von der Seite</text>
  <text x="30" y="64" fill="#56616e" font-size="15">Beide Kanten sind von oben bis unten erreichbar; das Panel muss dafür nicht aus der Wand.</text>

  <!-- ================= KANTE MIT KARTE UND STECKER ================= -->
  <text x="30" y="108" fill="#0b3d6b" font-size="19" font-weight="600">Kante in Bild 1 links</text>
  <rect x="30" y="120" width="540" height="270" rx="12" fill="#f7f9fb" stroke="#c5cdd5" stroke-width="1.4"/>

  <rect x="150" y="140" width="34" height="230" fill="#1b2230"/>
  <rect x="150" y="140" width="6" height="230" fill="#2c3440"/>

  <!-- 2: microSD (TF) - Karte kommt von aussen in den Slot -->
  <rect x="136" y="176" width="48" height="48" rx="3" fill="#0a0d12" stroke="#8f9aa8" stroke-width="1.4"/>
  <rect x="150" y="188" width="22" height="24" rx="2" fill="#20252e"/>
  <path d="M184,182 L292,182 L300,192 L300,210 L292,220 L184,220 Z" fill="#cfd6dd"/>
  <rect x="184" y="206" width="116" height="8" fill="#aab4bf"/>
  <path d="M330,172 L212,172" stroke="#5c6b7a" stroke-width="1.8" marker-end="url(#pfeil)"/>
  <text x="338" y="177" fill="#44525f" font-size="14">einschieben, bis es einrastet</text>
  <text x="242" y="240" fill="#5c6b7a" font-size="13" text-anchor="middle">microSD (TF)</text>
  <circle cx="112" cy="200" r="12" fill="#0b6bcb"/>
  <text x="112" y="206" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">2</text>

  <!-- 3: USB-C - Stecker kommt von der Seite in die Buchse -->
  <rect x="136" y="296" width="48" height="36" rx="7" fill="#3a4350" stroke="#8f9aa8" stroke-width="1.4"/>
  <rect x="144" y="302" width="28" height="24" rx="3" fill="#06080c"/>
  <rect x="184" y="300" width="58" height="28" rx="6" fill="#c9d2db"/>
  <rect x="242" y="305" width="100" height="18" rx="8" fill="#2a3040"/>
  <path d="M352,314 L372,314" stroke="#5c6b7a" stroke-width="1.8" marker-end="url(#pfeil)"/>
  <text x="380" y="319" fill="#44525f" font-size="14">Netzteil, 5 V</text>
  <text x="242" y="356" fill="#5c6b7a" font-size="13" text-anchor="middle">USB-C</text>
  <circle cx="112" cy="314" r="12" fill="#0b6bcb"/>
  <text x="112" y="320" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">3</text>

  <!-- ================= KANTE MIT RELAIS ================= -->
  <text x="620" y="108" fill="#0b3d6b" font-size="19" font-weight="600">Kante in Bild 1 rechts</text>
  <rect x="620" y="120" width="550" height="270" rx="12" fill="#f7f9fb" stroke="#c5cdd5" stroke-width="1.4"/>

  <rect x="1094" y="140" width="34" height="230" fill="#1b2230"/>
  <rect x="1122" y="140" width="6" height="230" fill="#2c3440"/>

  <text x="650" y="182" fill="#0b3d6b" font-size="17" font-weight="600">Relais-Port „1Way“</text>
  <text x="650" y="204" fill="#44525f" font-size="14">drei Anschlüsse: gemeinsam, Schließer, Öffner</text>
  <text x="650" y="226" fill="#44525f" font-size="14">potentialfrei; drei Adern zum Verbraucher</text>
  <text x="650" y="254" fill="#44525f" font-size="14">Der Stecker kommt von der Seite:</text>
  <text x="650" y="274" fill="#44525f" font-size="14">neben dem Panel muss Platz bleiben.</text>

  <!-- 4: Relais-Port - dreipolige Buchse, Stecker steckt von aussen hinein -->
  <rect x="1098" y="176" width="40" height="64" rx="4" fill="#e8edf2" stroke="#8f9aa8" stroke-width="1.4"/>
  <g fill="#98a4b1">
    <rect x="1090" y="184" width="10" height="10" rx="1.5"/>
    <rect x="1090" y="203" width="10" height="10" rx="1.5"/>
    <rect x="1090" y="222" width="10" height="10" rx="1.5"/>
  </g>
  <rect x="1010" y="180" width="70" height="56" rx="4" fill="#dfe5eb"/>
  <g stroke="#8f9aa8" stroke-width="1.2">
    <line x1="1024" y1="180" x2="1024" y2="236"/>
    <line x1="1045" y1="180" x2="1045" y2="236"/>
    <line x1="1066" y1="180" x2="1066" y2="236"/>
  </g>
  <g stroke="#5c6b7a" stroke-width="2.4" stroke-linecap="round">
    <path d="M1004,192 L944,306"/>
    <path d="M1004,208 L944,326"/>
    <path d="M1004,224 L944,346"/>
  </g>
  <circle cx="1152" cy="208" r="12" fill="#0b6bcb"/>
  <text x="1152" y="214" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">4</text>

  <text x="936" y="292" fill="#7a8794" font-size="13" text-anchor="end">drei Adern</text>
  <path d="M944,360 L872,360" stroke="#a9b6c3" stroke-width="1.6"/>
  <path d="M944,354 L944,366 M872,354 L872,366" stroke="#a9b6c3" stroke-width="1.6"/>
  <text x="908" y="348" fill="#7a8794" font-size="13" text-anchor="middle">Freiraum</text>
</svg>