<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" font-family="DejaVu Sans, sans-serif">
  <defs>
    <clipPath id="scr"><rect x="43" y="83" width="284" height="284" rx="14"/></clipPath>
  </defs>

  <!-- ================= FRONT VIEW (links) ================= -->
  <rect x="25" y="65" width="320" height="320" rx="16" fill="#2a3040" stroke="#ffffff14" stroke-width="1.5"/>
  <rect x="43" y="83" width="284" height="284" rx="14" fill="#0d1722" stroke="#00000055" stroke-width="1.2"/>
  <g clip-path="url(#scr)">
    <rect x="43" y="83" width="284" height="26" fill="#16232f"/>
    <text x="57" y="101" fill="#e8edf2" font-size="12" font-weight="600">RCT Power Panel</text>
    <g stroke="#ffffff0c" stroke-width="1.2">
      <line x1="43" y1="155" x2="327" y2="155"/>
      <line x1="43" y1="195" x2="327" y2="195"/>
      <line x1="43" y1="235" x2="327" y2="235"/>
    </g>
    <polyline points="43,310 95,270 135,230 180,200 327,170" fill="none" stroke="#ca0c0f" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="43,322 105,245 160,205 210,185 327,160" fill="none" stroke="#3ec97a" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="43,334 145,295 215,280 327,272" fill="none" stroke="#2e93e5" stroke-width="3" stroke-linejoin="round"/>
    <rect x="43" y="340" width="92" height="26" rx="9" fill="#233040"/>
    <path d="M71,353 L81,344 L81,362 Z" fill="#dbe4ec"/>
    <rect x="139" y="340" width="92" height="26" rx="9" fill="#233040"/>
    <path d="M176,352 L194,352 L185,342 Z" fill="#dbe4ec"/>
    <rect x="176" y="352" width="18" height="12" fill="#dbe4ec"/>
    <rect x="183" y="358" width="4" height="6" fill="#233040"/>
    <rect x="235" y="340" width="92" height="26" rx="9" fill="#233040"/>
    <path d="M291,353 L281,344 L281,362 Z" fill="#dbe4ec"/>
  </g>
  <circle cx="300" cy="110" r="12" fill="#0b6bcb"/>
  <text x="300" y="116" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">1</text>
  <text x="185" y="434" fill="#56616e" font-size="16" text-anchor="middle">Vorderseite</text>

  <!-- ================= LEGENDE (Mitte) ================= -->
  <!-- Die Nummern sitzen auf den Ansichten, nicht am Rand der Legende: nur so
       bleiben beide Kanten der Rueckseite (TF/USB links, UART/Batterie/Relais
       rechts) ueber die Nummern erreichbar, ohne dass eine Fuehrungslinie um
       die ganze Grafik herumlaufen muss. Grau = von der Firmware nicht
       benutzt. -->
  <rect x="390" y="65" width="380" height="345" rx="14" fill="#eef5fb" stroke="#b9d3ec" stroke-width="1.5"/>
  <text x="412" y="101" fill="#0b3d6b" font-size="26" font-weight="700">Anschlüsse</text>
  <line x1="412" y1="113" x2="748" y2="113" stroke="#b9d3ec" stroke-width="1.5"/>

  <!-- Die Legende ist eine Grafik, kein Fliesstext: keine Kapitelverweise
       darin. Wer mehr wissen will, steht im Handbuch. -->
  <circle cx="403" cy="138" r="11.5" fill="#0b6bcb"/>
  <text x="403" y="144" fill="#ffffff" font-size="14.5" font-weight="700" text-anchor="middle">1</text>
  <text x="422" y="144" fill="#0b3d6b" font-size="19" font-weight="600">Touch-Display</text>
  <text x="422" y="162" fill="#44525f" font-size="13">kapazitiv · 480 × 480 px</text>

  <circle cx="403" cy="200" r="11.5" fill="#0b6bcb"/>
  <text x="403" y="206" fill="#ffffff" font-size="14.5" font-weight="700" text-anchor="middle">2</text>
  <text x="422" y="206" fill="#0b3d6b" font-size="19" font-weight="600">microSD (TF)</text>
  <text x="422" y="224" fill="#44525f" font-size="13">Aufzeichnung der Messwerte</text>

  <circle cx="403" cy="262" r="11.5" fill="#0b6bcb"/>
  <text x="403" y="268" fill="#ffffff" font-size="14.5" font-weight="700" text-anchor="middle">3</text>
  <text x="422" y="268" fill="#0b3d6b" font-size="19" font-weight="600">USB-C</text>
  <text x="422" y="286" fill="#44525f" font-size="13">Versorgung 5 V · Firmware per Kabel</text>

  <circle cx="403" cy="324" r="11.5" fill="#0b6bcb"/>
  <text x="403" y="330" fill="#ffffff" font-size="14.5" font-weight="700" text-anchor="middle">4</text>
  <text x="422" y="330" fill="#0b3d6b" font-size="19" font-weight="600">Schaltkontakt</text>

  <!-- ================= BACK VIEW (rechts) ================= -->
  <rect x="820" y="65" width="320" height="320" rx="16" fill="#191f2a" stroke="#ffffff0d" stroke-width="1.5"/>
  <line x1="821" y1="66" x2="1139" y2="66" stroke="#ffffff22" stroke-width="2" stroke-linecap="round"/>
  <circle cx="836" cy="81" r="4.5" fill="#2c3440" stroke="#00000040"/>
  <circle cx="1124" cy="81" r="4.5" fill="#2c3440" stroke="#00000040"/>
  <circle cx="836" cy="369" r="4.5" fill="#2c3440" stroke="#00000040"/>
  <circle cx="1124" cy="369" r="4.5" fill="#2c3440" stroke="#00000040"/>

  <!-- Antennenbereich (oben links auf der Platine) -->
  <rect x="856" y="86" width="46" height="30" rx="6" fill="#202835"/>
  <path d="M864,110 L876,92 L888,108 L900,92" fill="none" stroke="#39434f" stroke-width="1.6"/>
  <path d="M864,118 L876,100 L888,116 L900,100" fill="none" stroke="#39434f" stroke-width="1.6"/>

  <!-- 2: microSD / TF, linke Kante oben -->
  <rect x="812" y="150" width="28" height="26" rx="3" fill="#05070b"/>
  <rect x="814" y="152" width="22" height="22" fill="#0f1620"/>
  <rect x="834" y="157" width="8" height="12" rx="1" fill="#d9a520"/>
  <circle cx="874" cy="163" r="12" fill="#0b6bcb"/>
  <text x="874" y="169" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">2</text>

  <!-- 3: USB-C, linke Kante unten -->
  <rect x="804" y="296" width="30" height="36" rx="7" fill="#3a4350"/>
  <rect x="808" y="300" width="22" height="28" rx="4" fill="#06080c"/>
  <line x1="815" y1="306" x2="815" y2="320" stroke="#9fb4c7" stroke-width="1.5"/>
  <line x1="823" y1="306" x2="823" y2="320" stroke="#9fb4c7" stroke-width="1.5"/>
  <circle cx="874" cy="314" r="12" fill="#0b6bcb"/>
  <text x="874" y="320" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">3</text>

  <!-- 4: Schaltkontakt am Pinheader H1, im unteren rechten Bereich der Platine -->
  <rect x="1066" y="263" width="27" height="45" rx="2" fill="#101317"/>
  <g fill="#4a5058">
    <rect x="1070" y="268" width="6" height="6"/><rect x="1083" y="268" width="6" height="6"/>
    <rect x="1070" y="280" width="6" height="6"/><rect x="1083" y="280" width="6" height="6"/>
    <rect x="1070" y="292" width="6" height="6"/><rect x="1083" y="292" width="6" height="6"/>
  </g>
  <rect x="1067" y="264" width="13" height="26" rx="2" fill="#0b6bcb" fill-opacity="0.25"
        stroke="#0b6bcb" stroke-width="1.6"/>
  <circle cx="1040" cy="285" r="12" fill="#0b6bcb"/>
  <text x="1040" y="291" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">4</text>

  <!-- ESP32-S3 module (Mitte) -->
  <rect x="886" y="196" width="100" height="54" rx="6" fill="#bcc3ca"/>
  <rect x="908" y="214" width="56" height="20" rx="3" fill="#6e7782"/>
  <text x="936" y="276" fill="#8f9aa8" font-size="14" text-anchor="middle">ESP32-S3</text>
  <text x="936" y="296" fill="#56616e" font-size="12" text-anchor="middle">ESP32-S3 4848S040</text>

  <text x="975" y="434" fill="#56616e" font-size="16" text-anchor="middle">Rückseite</text>
</svg>