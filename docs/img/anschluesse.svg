  <text x="185" y="479" fill="#56616e" font-size="16" text-anchor="middle">Vorderseite</text>

  <!-- ================= LEGENDE (Mitte) ================= -->
  <!-- Die Nummern sitzen auf den Ansichten, nicht am Rand der Legende: nur so
       bleiben beide Kanten der Rueckseite (TF/USB links, UART/Batterie/Relais
       rechts) ueber die Nummern erreichbar, ohne dass eine Fuehrungslinie um
       die ganze Grafik herumlaufen muss. Grau = von der Firmware nicht
       benutzt. -->
  <rect x="390" y="65" width="380" height="390" rx="14" fill="#eef5fb" stroke="#b9d3ec" stroke-width="1.5"/>
  <text x="412" y="101" fill="#0b3d6b" font-size="26" font-weight="700">Anschlüsse</text>
  <line x1="412" y1="113" x2="748" y2="113" stroke="#b9d3ec" stroke-width="1.5"/>

  <circle cx="403" cy="148" r="11.5" fill="#0b6bcb"/>
  <text x="403" y="154" fill="#ffffff" font-size="14.5" font-weight="700" text-anchor="middle">1</text>
  <text x="422" y="154" fill="#0b3d6b" font-size="19" font-weight="600">Touch-Display</text>
  <text x="422" y="172" fill="#44525f" font-size="13">kapazitiv · 480 × 480 px</text>

  <circle cx="403" cy="194" r="11.5" fill="#0b6bcb"/>
  <text x="403" y="200" fill="#ffffff" font-size="14.5" font-weight="700" text-anchor="middle">2</text>
  <text x="422" y="200" fill="#0b3d6b" font-size="19" font-weight="600">microSD (TF)</text>
  <text x="422" y="218" fill="#44525f" font-size="13">Aufzeichnung der Messwerte, Kapitel 4</text>

  <circle cx="403" cy="240" r="11.5" fill="#0b6bcb"/>
  <text x="403" y="246" fill="#ffffff" font-size="14.5" font-weight="700" text-anchor="middle">3</text>
  <text x="422" y="246" fill="#0b3d6b" font-size="19" font-weight="600">USB-C</text>
  <text x="422" y="264" fill="#44525f" font-size="13">Versorgung 5 V · Firmware per Kabel, Kapitel 10</text>

  <circle cx="403" cy="286" r="11.5" fill="#0b6bcb"/>
  <text x="403" y="292" fill="#ffffff" font-size="14.5" font-weight="700" text-anchor="middle">4</text>
  <text x="422" y="292" fill="#0b3d6b" font-size="19" font-weight="600">UART (P1)</text>
  <text x="422" y="310" fill="#44525f" font-size="13">nur Service: GND, RXD, TXD, 5 V</text>

  <circle cx="403" cy="332" r="11.5" fill="#9aa7b4"/>
  <text x="403" y="338" fill="#ffffff" font-size="14.5" font-weight="700" text-anchor="middle">5</text>
  <text x="422" y="338" fill="#0b3d6b" font-size="19" font-weight="600">Batterie-Port</text>
  <text x="422" y="356" fill="#44525f" font-size="13">B+ / B− · von der Firmware nicht benutzt</text>

  <circle cx="403" cy="378" r="11.5" fill="#0b6bcb"/>
  <text x="403" y="384" fill="#ffffff" font-size="14.5" font-weight="700" text-anchor="middle">6</text>
  <text x="422" y="384" fill="#0b3d6b" font-size="19" font-weight="600">Relais-Port „1Way“</text>
  <text x="422" y="402" fill="#44525f" font-size="13">Schaltkontakt, Kapitel 6</text>

  <circle cx="403" cy="424" r="11.5" fill="#9aa7b4"/>
  <text x="403" y="430" fill="#ffffff" font-size="14.5" font-weight="700" text-anchor="middle">7</text>
  <text x="422" y="430" fill="#0b3d6b" font-size="19" font-weight="600">Lautsprecher</text>
  <text x="422" y="448" fill="#44525f" font-size="13">von der Firmware nicht benutzt: kein Ton</text>

