<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" font-family="DejaVu Sans, sans-serif">
  <defs>
    <clipPath id="scr"><rect x="32" y="62" width="126" height="126" rx="12"/></clipPath>
  </defs>

  <!-- ================= FRONT VIEW (links) ================= -->
  <rect x="20" y="50" width="150" height="150" rx="12" fill="#2a3040" stroke="#ffffff14" stroke-width="1.5"/>
  <rect x="32" y="62" width="126" height="126" rx="12" fill="#0d1722" stroke="#00000055" stroke-width="1.2"/>
  <g clip-path="url(#scr)">
    <rect x="32" y="62" width="126" height="16" fill="#16232f"/>
    <text x="42" y="74" fill="#e8edf2" font-size="9" font-weight="600">RCT Power Panel</text>
    <g stroke="#ffffff0c" stroke-width="1">
      <line x1="32" y1="100" x2="158" y2="100"/>
      <line x1="32" y1="120" x2="158" y2="120"/>
      <line x1="32" y1="140" x2="158" y2="140"/>
    </g>
    <polyline points="32,152 62,136 90,118 118,106 158,96" fill="none" stroke="#ca0c0f" stroke-width="2.2" stroke-linejoin="round"/>
    <polyline points="32,158 68,126 100,108 130,100 158,90" fill="none" stroke="#3ec97a" stroke-width="2.2" stroke-linejoin="round"/>
    <polyline points="32,164 90,146 130,138 158,136" fill="none" stroke="#2e93e5" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="42" y="170" width="26" height="16" rx="6" fill="#233040"/>
    <path d="M47,178 L53,172.5 L53,183.5 Z" fill="#dbe4ec"/>
    <rect x="80" y="170" width="26" height="16" rx="6" fill="#233040"/>
    <path d="M86,182 L86,175 L94,177 L86,182 Z" fill="#dbe4ec"/>
    <rect x="118" y="170" width="26" height="16" rx="6" fill="#233040"/>
    <path d="M141,178 L135,172.5 L135,183.5 Z" fill="#dbe4ec"/>
  </g>
  <text x="95" y="216" fill="#56616e" font-size="13" text-anchor="middle">Vorderseite</text>

  <!-- ================= LEGEND (Mitte) ================= -->
  <rect x="200" y="24" width="360" height="324" rx="14" fill="#eef5fb" stroke="#b9d3ec" stroke-width="1.5"/>
  <text x="226" y="66" fill="#0b3d6b" font-size="26" font-weight="700">Schnittstellen</text>
  <line x1="226" y1="78" x2="532" y2="78" stroke="#b9d3ec" stroke-width="1.5"/>

  <!-- row 1: touch -->
  <circle cx="256" cy="134" r="18" fill="#0b6bcb"/>
  <text x="256" y="141" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">1</text>
  <text x="280" y="129" fill="#0b3d6b" font-size="24" font-weight="600">Touch-Display</text>
  <text x="280" y="155" fill="#44525f" font-size="16.5">kapazitiv · 480 × 480 px</text>

  <!-- row 2: microSD -->
  <circle cx="256" cy="224" r="18" fill="#0b6bcb"/>
  <text x="256" y="231" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">2</text>
  <text x="280" y="219" fill="#0b3d6b" font-size="24" font-weight="600">microSD (TF)</text>
  <text x="280" y="245" fill="#44525f" font-size="16.5">Steckplatz auf der Rückseite</text>

  <!-- row 3: usb-c -->
  <circle cx="256" cy="314" r="18" fill="#0b6bcb"/>
  <text x="256" y="321" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">3</text>
  <text x="280" y="309" fill="#0b3d6b" font-size="24" font-weight="600">USB-C</text>
  <text x="280" y="335" fill="#44525f" font-size="16.5">Stromversorgung (5 V)</text>

  <!-- ================= BACK VIEW (rechts) ================= -->
  <rect x="760" y="30" width="300" height="300" rx="12" fill="#191f2a" stroke="#ffffff0d" stroke-width="1.5"/>
  <line x1="761" y1="31" x2="1059" y2="31" stroke="#ffffff22" stroke-width="2" stroke-linecap="round"/>
  <circle cx="776" cy="46" r="4.5" fill="#2c3440" stroke="#00000040"/>
  <circle cx="1044" cy="46" r="4.5" fill="#2c3440" stroke="#00000040"/>
  <circle cx="776" cy="314" r="4.5" fill="#2c3440" stroke="#00000040"/>
  <circle cx="1044" cy="314" r="4.5" fill="#2c3440" stroke="#00000040"/>

  <!-- USB-C connector straddling the top edge -->
  <rect x="896" y="14" width="28" height="32" rx="6" fill="#3a4350"/>
  <rect x="901" y="18" width="18" height="24" rx="4" fill="#06080c"/>
  <line x1="906" y1="24" x2="906" y2="36" stroke="#9fb4c7" stroke-width="1.5"/>
  <line x1="914" y1="24" x2="914" y2="36" stroke="#9fb4c7" stroke-width="1.5"/>

  <!-- antenna zone (top right) -->
  <rect x="1004" y="44" width="48" height="40" rx="6" fill="#202835"/>
  <path d="M1012,70 L1022,52 L1032,68 L1042,52" fill="none" stroke="#39434f" stroke-width="1.6"/>
  <path d="M1012,78 L1022,60 L1032,76 L1042,60" fill="none" stroke="#39434f" stroke-width="1.6"/>

  <!-- ESP32-S3 module -->
  <rect x="824" y="86" width="100" height="54" rx="6" fill="#bcc3ca"/>
  <rect x="846" y="104" width="56" height="20" rx="3" fill="#6e7782"/>
  <text x="874" y="162" fill="#8f9aa8" font-size="14" text-anchor="middle">ESP32-S3</text>
  <text x="874" y="186" fill="#56616e" font-size="12" text-anchor="middle">ESP32-S3 4848S040</text>

  <!-- microSD / TF slot at the left edge, card sticking out sideways -->
  <rect x="756" y="194" width="28" height="24" rx="3" fill="#05070b"/>
  <rect x="704" y="198" width="76" height="16" rx="2" fill="#0b6bcb" stroke="#084a8f" stroke-width="1"/>
  <rect x="758" y="200" width="20" height="12" fill="#d9a520"/>

  <text x="910" y="346" fill="#56616e" font-size="13" text-anchor="middle">Rückseite</text>

  <!-- ================= LEADERS ================= -->
  <g stroke-linecap="round" fill="none">
    <!-- 1: touch display -->
    <path d="M170,128 L256,134" stroke="#ffffff" stroke-width="4.5" opacity="0.9"/>
    <path d="M170,128 L256,134" stroke="#0b6bcb" stroke-width="1.8"/>
    <!-- 2: microSD -->
    <path d="M736,206 L256,224" stroke="#ffffff" stroke-width="4.5" opacity="0.9"/>
    <path d="M736,206 L256,224" stroke="#0b6bcb" stroke-width="1.8"/>
    <!-- 3: usb-c (over the top, down the gap, under the legend into row 3) -->
    <path d="M910,26 L700,26 L700,352 L256,352 L256,314" stroke="#ffffff" stroke-width="4.5" opacity="0.9"/>
    <path d="M910,26 L700,26 L700,352 L256,352 L256,314" stroke="#0b6bcb" stroke-width="1.8"/>
  </g>
</svg>