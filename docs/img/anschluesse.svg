<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="DejaVu Sans, sans-serif">
  <defs>
    <clipPath id="scr"><rect x="46" y="91" width="198" height="198" rx="12"/></clipPath>
  </defs>

  <!-- ================= FRONT VIEW (links, gleich gross wie Rueckseite) ================= -->
  <rect x="30" y="75" width="230" height="230" rx="14" fill="#2a3040" stroke="#ffffff14" stroke-width="1.5"/>
  <rect x="46" y="91" width="198" height="198" rx="12" fill="#0d1722" stroke="#00000055" stroke-width="1.2"/>
  <g clip-path="url(#scr)">
    <rect x="46" y="91" width="198" height="22" fill="#16232f"/>
    <text x="58" y="106" fill="#e8edf2" font-size="11" font-weight="600">RCT Power Panel</text>
    <g stroke="#ffffff0c" stroke-width="1.2">
      <line x1="46" y1="150" x2="244" y2="150"/>
      <line x1="46" y1="185" x2="244" y2="185"/>
      <line x1="46" y1="220" x2="244" y2="220"/>
    </g>
    <polyline points="46,240 90,210 130,180 170,160 244,140" fill="none" stroke="#ca0c0f" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="46,250 100,190 150,160 200,145 244,130" fill="none" stroke="#3ec97a" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="46,260 130,230 200,220 244,215" fill="none" stroke="#2e93e5" stroke-width="3" stroke-linejoin="round"/>
    <rect x="62" y="262" width="36" height="20" rx="8" fill="#233040"/>
    <path d="M70,272 L78,264.5 L78,279.5 Z" fill="#dbe4ec"/>
    <rect x="120" y="262" width="36" height="20" rx="8" fill="#233040"/>
    <path d="M128,279 L128,270 L138,273 L128,279 Z" fill="#dbe4ec"/>
    <rect x="178" y="262" width="36" height="20" rx="8" fill="#233040"/>
    <path d="M204,272 L196,264.5 L196,279.5 Z" fill="#dbe4ec"/>
  </g>
  <text x="145" y="330" fill="#56616e" font-size="13" text-anchor="middle">Vorderseite</text>

  <!-- ================= LEGEND (Mitte, Zahlen beidseitig am Text) ================= -->
  <rect x="300" y="30" width="380" height="320" rx="14" fill="#eef5fb" stroke="#b9d3ec" stroke-width="1.5"/>
  <text x="326" y="66" fill="#0b3d6b" font-size="26" font-weight="700">Schnittstellen</text>
  <line x1="326" y1="78" x2="654" y2="78" stroke="#b9d3ec" stroke-width="1.5"/>

  <!-- row 1: touch  (Zahl LINKS, Vorderseite ist links) -->
  <circle cx="332" cy="140" r="18" fill="#0b6bcb"/>
  <text x="332" y="147" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">1</text>
  <text x="360" y="135" fill="#0b3d6b" font-size="24" font-weight="600">Touch-Display</text>
  <text x="360" y="160" fill="#44525f" font-size="16.5">kapazitiv · 480 × 480 px</text>

  <!-- row 2: microSD  (Zahl RECHTS, Rueckseite ist rechts) -->
  <text x="318" y="225" fill="#0b3d6b" font-size="24" font-weight="600">microSD (TF)</text>
  <text x="318" y="250" fill="#44525f" font-size="16.5">Steckplatz auf der Rückseite</text>
  <circle cx="650" cy="230" r="18" fill="#0b6bcb"/>
  <text x="650" y="237" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">2</text>

  <!-- row 3: usb-c  (Zahl RECHTS) -->
  <text x="318" y="315" fill="#0b3d6b" font-size="24" font-weight="600">USB-C</text>
  <text x="318" y="340" fill="#44525f" font-size="16.5">Stromversorgung (5 V)</text>
  <circle cx="650" cy="320" r="18" fill="#0b6bcb"/>
  <text x="650" y="327" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">3</text>

  <!-- ================= BACK VIEW (rechts, gleich gross wie Vorderseite) ================= -->
  <rect x="730" y="75" width="230" height="230" rx="14" fill="#191f2a" stroke="#ffffff0d" stroke-width="1.5"/>
  <line x1="731" y1="76" x2="959" y2="76" stroke="#ffffff22" stroke-width="2" stroke-linecap="round"/>
  <circle cx="746" cy="91" r="4.5" fill="#2c3440" stroke="#00000040"/>
  <circle cx="944" cy="91" r="4.5" fill="#2c3440" stroke="#00000040"/>
  <circle cx="746" cy="289" r="4.5" fill="#2c3440" stroke="#00000040"/>
  <circle cx="944" cy="289" r="4.5" fill="#2c3440" stroke="#00000040"/>

  <!-- USB-C connector straddling the top edge -->
  <rect x="831" y="59" width="28" height="32" rx="6" fill="#3a4350"/>
  <rect x="836" y="63" width="18" height="24" rx="4" fill="#06080c"/>
  <line x1="841" y1="69" x2="841" y2="81" stroke="#9fb4c7" stroke-width="1.5"/>
  <line x1="849" y1="69" x2="849" y2="81" stroke="#9fb4c7" stroke-width="1.5"/>

  <!-- antenna zone (top right) -->
  <rect x="906" y="88" width="48" height="40" rx="6" fill="#202835"/>
  <path d="M914,116 L924,96 L934,112 L944,96" fill="none" stroke="#39434f" stroke-width="1.6"/>
  <path d="M914,124 L924,104 L934,120 L944,104" fill="none" stroke="#39434f" stroke-width="1.6"/>

  <!-- ESP32-S3 module -->
  <rect x="780" y="110" width="100" height="54" rx="6" fill="#bcc3ca"/>
  <rect x="802" y="128" width="56" height="20" rx="3" fill="#6e7782"/>
  <text x="830" y="190" fill="#8f9aa8" font-size="14" text-anchor="middle">ESP32-S3</text>
  <text x="830" y="212" fill="#56616e" font-size="12" text-anchor="middle">ESP32-S3 4848S040</text>

  <!-- microSD / TF slot at the left edge of the back view, card sticking out sideways -->
  <rect x="724" y="196" width="26" height="24" rx="3" fill="#05070b"/>
  <rect x="686" y="198" width="44" height="16" rx="2" fill="#0b6bcb" stroke="#084a8f" stroke-width="1"/>
  <rect x="712" y="200" width="14" height="12" fill="#d9a520"/>

  <text x="845" y="330" fill="#56616e" font-size="13" text-anchor="middle">Rückseite</text>

  <!-- ================= LEADERS ================= -->
  <g stroke-linecap="round" fill="none">
    <!-- 1: von der Vorderseite (links) zum linken Zahl-Badge -->
    <path d="M260,190 L332,140" stroke="#ffffff" stroke-width="4.5" opacity="0.9"/>
    <path d="M260,190 L332,140" stroke="#0b6bcb" stroke-width="1.8"/>
    <!-- 2: microSD, kurze Verbindung zum rechten Zahl-Badge -->
    <path d="M694,208 L660,230 L650,230" stroke="#ffffff" stroke-width="4.5" opacity="0.9"/>
    <path d="M694,208 L660,230 L650,230" stroke="#0b6bcb" stroke-width="1.8"/>
    <!-- 3: usb-c, ueber die Oberkante in den Spalt und von unten an das rechte Badge -->
    <path d="M845,58 L700,48 L700,320 L650,320" stroke="#ffffff" stroke-width="4.5" opacity="0.9"/>
    <path d="M845,58 L700,48 L700,320 L650,320" stroke="#0b6bcb" stroke-width="1.8"/>
  </g>
</svg>