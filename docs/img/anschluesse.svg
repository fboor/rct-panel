<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" font-family="DejaVu Sans, sans-serif">
  <defs>
    <clipPath id="scr"><rect x="372" y="52" width="126" height="126" rx="12"/></clipPath>
  </defs>

  <!-- ================= BACK VIEW (Rueckseite, Hauptansicht) ================= -->
  <rect x="30" y="30" width="300" height="300" rx="12" fill="#191f2a" stroke="#ffffff0d" stroke-width="1.5"/>
  <line x1="31" y1="31" x2="329" y2="31" stroke="#ffffff22" stroke-width="2" stroke-linecap="round"/>
  <!-- corner screws -->
  <circle cx="46" cy="46" r="4.5" fill="#2c3440" stroke="#00000040"/>
  <circle cx="314" cy="46" r="4.5" fill="#2c3440" stroke="#00000040"/>
  <circle cx="46" cy="314" r="4.5" fill="#2c3440" stroke="#00000040"/>
  <circle cx="314" cy="314" r="4.5" fill="#2c3440" stroke="#00000040"/>

  <!-- USB-C connector straddling the top edge (side-accessible, visible from behind) -->
  <rect x="168" y="16" width="28" height="30" rx="6" fill="#3a4350"/>
  <rect x="173" y="20" width="18" height="22" rx="4" fill="#06080c"/>
  <line x1="178" y1="26" x2="178" y2="36" stroke="#9fb4c7" stroke-width="1.5"/>
  <line x1="186" y1="26" x2="186" y2="36" stroke="#9fb4c7" stroke-width="1.5"/>

  <!-- antenna zone (top right) -->
  <rect x="236" y="44" width="64" height="38" rx="6" fill="#202835"/>
  <path d="M244,68 L254,52 L264,68 L274,52 L284,68" fill="none" stroke="#39434f" stroke-width="1.6"/>
  <path d="M244,76 L254,60 L264,76 L274,60 L284,76" fill="none" stroke="#39434f" stroke-width="1.6"/>

  <!-- ESP32-S3 module -->
  <rect x="70" y="70" width="100" height="54" rx="6" fill="#bcc3ca"/>
  <rect x="92" y="88" width="56" height="20" rx="3" fill="#6e7782"/>
  <text x="120" y="146" fill="#8f9aa8" font-size="14" text-anchor="middle">ESP32-S3</text>

  <!-- microSD / TF slot at the right edge, card sticking out sideways -->
  <rect x="300" y="240" width="30" height="22" rx="4" fill="#05070b"/>
  <rect x="326" y="242" width="62" height="18" rx="2" fill="#0b6bcb" stroke="#084a8f" stroke-width="1"/>
  <rect x="328" y="244" width="26" height="14" fill="#d9a520"/>

  <text x="180" y="346" fill="#56616e" font-size="13" text-anchor="middle">Rückseite</text>

  <!-- ================= FRONT THUMBNAIL (Vorderseite: Touch-Display) ================= -->
  <rect x="360" y="40" width="150" height="150" rx="12" fill="#2a3040" stroke="#ffffff14" stroke-width="1.5"/>
  <rect x="372" y="52" width="126" height="126" rx="12" fill="#0d1722" stroke="#00000055" stroke-width="1.2"/>
  <g clip-path="url(#scr)">
    <rect x="370" y="50" width="130" height="16" fill="#16232f"/>
    <text x="378" y="62" fill="#e8edf2" font-size="9" font-weight="600">RCT Power Panel</text>
    <g stroke="#ffffff0c" stroke-width="1">
      <line x1="372" y1="92" x2="498" y2="92"/>
      <line x1="372" y1="112" x2="498" y2="112"/>
      <line x1="372" y1="132" x2="498" y2="132"/>
    </g>
    <polyline points="372,146 400,130 430,112 458,100 498,90" fill="none" stroke="#ca0c0f" stroke-width="2.2" stroke-linejoin="round"/>
    <polyline points="372,152 406,120 440,102 470,94 498,84" fill="none" stroke="#3ec97a" stroke-width="2.2" stroke-linejoin="round"/>
    <polyline points="372,158 430,140 470,132 498,130" fill="none" stroke="#2e93e5" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="382" y="162" width="26" height="16" rx="6" fill="#233040"/>
    <path d="M391,170 L397,164.5 L397,175.5 Z" fill="#dbe4ec"/>
    <rect x="420" y="162" width="28" height="16" rx="6" fill="#233040"/>
    <path d="M426,170 L426,165 L434,167.5 L426,170 Z" fill="#dbe4ec"/>
    <rect x="466" y="162" width="26" height="16" rx="6" fill="#233040"/>
    <path d="M477,170 L471,164.5 L471,175.5 Z" fill="#dbe4ec"/>
  </g>
  <text x="435" y="206" fill="#56616e" font-size="13" text-anchor="middle">Vorderseite</text>

  <!-- ================= LEADERS ================= -->
  <g stroke-linecap="round" fill="none">
    <!-- 1: touch display -->
    <path d="M490,110 L590,132" stroke="#ffffff" stroke-width="4.5" opacity="0.9"/>
    <path d="M490,110 L590,132" stroke="#0b6bcb" stroke-width="1.8"/>
    <!-- 2: microSD -->
    <path d="M352,251 L590,222" stroke="#ffffff" stroke-width="4.5" opacity="0.9"/>
    <path d="M352,251 L590,222" stroke="#0b6bcb" stroke-width="1.8"/>
    <!-- 3: usb-c (over the top, no crossing) -->
    <path d="M182,26 L700,16 L700,312 L590,312" stroke="#ffffff" stroke-width="4.5" opacity="0.9"/>
    <path d="M182,26 L700,16 L700,312 L590,312" stroke="#0b6bcb" stroke-width="1.8"/>
  </g>

  <!-- ================= LEGEND ================= -->
  <rect x="540" y="30" width="420" height="320" rx="14" fill="#eef5fb" stroke="#b9d3ec" stroke-width="1.5"/>
  <text x="564" y="66" fill="#0b3d6b" font-size="26" font-weight="700">Schnittstellen</text>
  <line x1="564" y1="80" x2="932" y2="80" stroke="#b9d3ec" stroke-width="1.5"/>

  <!-- row 1: touch -->
  <circle cx="590" cy="132" r="18" fill="#0b6bcb"/>
  <text x="590" y="139" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">1</text>
  <text x="614" y="127" fill="#0b3d6b" font-size="24" font-weight="600">Touch-Display</text>
  <text x="614" y="152" fill="#44525f" font-size="18">kapazitiv · 480 × 480 px</text>

  <!-- row 2: microSD -->
  <circle cx="590" cy="222" r="18" fill="#0b6bcb"/>
  <text x="590" y="229" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">2</text>
  <text x="614" y="217" fill="#0b3d6b" font-size="24" font-weight="600">microSD (TF)</text>
  <text x="614" y="242" fill="#44525f" font-size="18">Steckplatz auf der Rückseite</text>

  <!-- row 3: usb-c -->
  <circle cx="590" cy="312" r="18" fill="#0b6bcb"/>
  <text x="590" y="319" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">3</text>
  <text x="614" y="307" fill="#0b3d6b" font-size="24" font-weight="600">USB-C</text>
  <text x="614" y="332" fill="#44525f" font-size="18">Stromversorgung (5 V) · Kante</text>
</svg>