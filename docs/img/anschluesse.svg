<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="425" viewBox="0 0 1200 425" font-family="DejaVu Sans, sans-serif">
  <defs>
    <clipPath id="scr"><rect x="43" y="83" width="284" height="284" rx="14"/></clipPath>
  </defs>

  <!-- ================= FRONT VIEW (links) ================= -->
  <rect x="25" y="65" width="320" height="320" rx="16" fill="#2a3040" stroke="#ffffff14" stroke-width="1.5"/>
  <rect x="43" y="83" width="284" height="284" rx="14" fill="#0d1722" stroke="#00000055" stroke-width="1.2"/>
  <g clip-path="url(#scr)">
    <rect x="43" y="83" width="284" height="26" fill="#16232f"/>
    <text x="57" y="101" fill="#e8edf2" font-size="12" font-weight="600">RCT Power Panel</text>
    <g stroke="#ffffff0c" stroke-width="1.2">
      <line x1="43" y1="155" x2="327" y2="155"/>
      <line x1="43" y1="195" x2="327" y2="195"/>
      <line x1="43" y1="235" x2="327" y2="235"/>
    </g>
    <polyline points="43,310 95,270 135,230 180,200 327,170" fill="none" stroke="#ca0c0f" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="43,322 105,245 160,205 210,185 327,160" fill="none" stroke="#3ec97a" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="43,334 145,295 215,280 327,272" fill="none" stroke="#2e93e5" stroke-width="3" stroke-linejoin="round"/>
    <rect x="43" y="340" width="92" height="26" rx="9" fill="#233040"/>
    <path d="M71,353 L81,344 L81,362 Z" fill="#dbe4ec"/>
    <rect x="139" y="340" width="92" height="26" rx="9" fill="#233040"/>
    <path d="M176,352 L194,352 L185,342 Z" fill="#dbe4ec"/>
