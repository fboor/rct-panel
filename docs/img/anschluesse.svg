<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="425" viewBox="0 0 1200 425" font-family="DejaVu Sans, sans-serif">
  <defs>
    <clipPath id="scr"><rect x="43" y="83" width="284" height="284" rx="14"/></clipPath>
  </defs>

  <!-- ================= FRONT VIEW (links, gleiche Hoehe wie Legende) ================= -->
  <rect x="25" y="65" width="320" height="320" rx="16" fill="#2a3040" stroke="#ffffff14" stroke-width="1.5"/>
  <rect x="43" y="83" width="284" height="284" rx="14" fill="#0d1722" stroke="#00000055" stroke-width="1.2"/>
  <g clip-path="url(#scr)">
    <rect x="43" y="83" width="284" height="26" fill="#16232f"/>
    <text x="57" y="101" fill="#e8edf2" font-size="12" font-weight="600">RCT Power Panel</text>
    <g stroke="#ffffff0c" stroke-width="1.2">
      <line x1="43" y1="155" x2="327" y2="155"/>
      <line x1="43" y1="195" x2="327" y2="195"/>
      <line x1="43" y1="235" x2="327" y2="235"/>
    </g>
    <polyline points="43,310 95,270 135,230 180,200 327,170" fill="none" stroke="#ca0c0f" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="43,322 105,245 160,205 210,185 327,160" fill="none" stroke="#3ec97a" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="43,334 145,295 215,280 327,272" fill="none" stroke="#2e93e5" stroke-width="3" stroke-linejoin="round"/>
    <rect x="66" y="340" width="48" height="26" rx="9" fill="#233040"/>
    <path d="M74,353 L84,344 L84,362 Z" fill="#dbe4ec"/>
    <rect x="134" y="340" width="48" height="26" rx="9" fill="#233040"/>
    <path d="M143,362 L143,350 L155,354 L143,362 Z" fill="#dbe4ec"/>
    <rect x="202" y="340" width="48" height="26" rx="9" fill="#233040"/>
    <path d="M232,353 L222,344 L222,362 Z" fill="#dbe4ec"/>
  </g>
  <text x="185" y="410" fill="#56616e" font-size="13" text-anchor="middle">Vorderseite</text>

  <!-- ================= LEGEND (Mitte, Zahlen beidseitig am Text) ================= -->
  <rect x="390" y="30" width="380" height="320" rx="14" fill="#eef5fb" stroke="#b9d3ec" stroke-width="1.5"/>
  <text x="416" y="66" fill="#0b3d6b" font-size="26" font-weight="700">Schnittstellen</text>
  <line x1="416" y1="78" x2="744" y2="78" stroke="#b9d3ec" stroke-width="1.5"/>

  <!-- row 1: touch  (Zahl LINKS, Vorderseite ist links) -->
  <circle cx="422" cy="140" r="18" fill="#0b6bcb"/>
  <text x="422" y="147" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">1</text>
  <text x="450" y="135" fill="#0b3d6b" font-size="24" font-weight="600">Touch-Display</text>
  <text x="450" y="160" fill="#44525f" font-size="16.5">kapazitiv · 480 × 480 px</text>

  <!-- row 2: microSD  (Zahl RECHTS, Rueckseite ist rechts) -->
  <text x="408" y="225" fill="#0b3d6b" font-size="24" font-weight="600">microSD (TF)</text>
  <text x="408" y="250" fill="#44525f" font-size="16.5">Steckplatz auf der Rückseite</text>
  <circle cx="740" cy="230" r="18" fill="#0b6bcb"/>
  <text x="740" y="237" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">2</text>

  <!-- row 3: usb-c  (Zahl RECHTS) -->
  <text x="408" y="315" fill="#0b3d6b" font-size="24" font-weight="600">USB-C</text>
  <text x="408" y="340" fill="#44525f" font-size="16.5">Stromversorgung (5 V)</text>
  <circle cx="740" cy="320" r="18" fill="#0b6bcb"/>
  <text x="740" y="327" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">3</text>

  <!-- ================= BACK VIEW (rechts, gleiche Hoehe wie Legende) ================= -->
  <rect x="820" y="65" width="320" height="320" rx="16" fill="#191f2a" stroke="#ffffff0d" stroke-width="1.5"/>
  <line x1="821" y1="66" x2="1139" y2="66" stroke="#ffffff22" stroke-width="2" stroke-linecap="round"/>
  <circle cx="836" cy="81" r="4.5" fill="#2c3440" stroke="#00000040"/>
  <circle cx="1124" cy="81" r="4.5" fill="#2c3440" stroke="#00000040"/>
  <circle cx="836" cy="369" r="4.5" fill="#2c3440" stroke="#00000040"/>
  <circle cx="1124" cy="369" r="4.5" fill="#2c3440" stroke="#00000040"/>

  <!-- USB-C connector straddling the top edge -->
  <rect x="961" y="49" width="28" height="32" rx="6" fill="#3a4350"/>
  <rect x="966" y="53" width="18" height="24" rx="4" fill="#06080c"/>
  <line x1="971" y1="59" x2="971" y2="71" stroke="#9fb4c7" stroke-width="1.5"/>
  <line x1="979" y1="59" x2="979" y2="71" stroke="#9fb4c7" stroke-width="1.5"/>

  <!-- antenna zone (top right) -->
  <rect x="1086" y="88" width="50" height="42" rx="6" fill="#202835"/>
  <path d="M1094,118 L1106,94 L1118,112 L1130,94" fill="none" stroke="#39434f" stroke-width="1.6"/>
  <path d="M1094,128 L1106,104 L1118,122 L1130,104" fill="none" stroke="#39434f" stroke-width="1.6"/>

  <!-- ESP32-S3 module -->
  <rect x="880" y="140" width="100" height="54" rx="6" fill="#bcc3ca"/>
  <rect x="902" y="158" width="56" height="20" rx="3" fill="#6e7782"/>
  <text x="930" y="220" fill="#8f9aa8" font-size="14" text-anchor="middle">ESP32-S3</text>
  <text x="930" y="242" fill="#56616e" font-size="12" text-anchor="middle">ESP32-S3 4848S040</text>

  <!-- microSD / TF slot at the left edge of the back view, card sticking out sideways -->
  <rect x="814" y="240" width="26" height="24" rx="3" fill="#05070b"/>
  <rect x="770" y="242" width="66" height="20" rx="2" fill="#0b6bcb" stroke="#084a8f" stroke-width="1"/>
  <rect x="818" y="244" width="14" height="16" fill="#d9a520"/>

  <text x="975" y="410" fill="#56616e" font-size="13" text-anchor="middle">Rückseite</text>

  <!-- ================= LEADERS (enden am Rand der Kreise) ================= -->
  <g stroke-linecap="round" fill="none">
    <!-- 1: Vorderseite (links) zum linken Badge-Rand -->
    <path d="M345,225 L410,153" stroke="#ffffff" stroke-width="4.5" opacity="0.9"/>
    <path d="M345,225 L410,153" stroke="#0b6bcb" stroke-width="1.8"/>
    <!-- 2: microSD zum rechten Badge-Rand -->
    <path d="M774,252 L755,240" stroke="#ffffff" stroke-width="4.5" opacity="0.9"/>
    <path d="M774,252 L755,240" stroke="#0b6bcb" stroke-width="1.8"/>
    <!-- 3: usb-c, ueber die Oberkante in den Spalt und unten an das rechte Badge-Rand -->
    <path d="M975,54 L790,54 L790,320 L722,320" stroke="#ffffff" stroke-width="4.5" opacity="0.9"/>
    <path d="M975,54 L790,54 L790,320 L722,320" stroke="#0b6bcb" stroke-width="1.8"/>
  </g>
</svg>