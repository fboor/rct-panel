; PlatformIO Project Configuration File
;
; rct-panel - RCT Power data panel on the Guition ESP32-S3 4848S040
; (480x480 ST7701 RGB display + GT911 touch, 16 MB flash / 8 MB PSRAM)
;
; Stack: Arduino-ESP32 core 3.x (ESP-IDF 5.3) + esp_lcd RGB panel + LVGL 9
;        + WiFiManager captive portal for Wi-Fi/RCT configuration.

[platformio]
description = RCT Power wall panel (Guition ESP32-S3-4848S040)

[env]
framework = arduino
platform = espressif32@6.8.0
monitor_speed = 115200
; Stamps the commit into the binary, so the panel can say which build it runs.
extra_scripts = pre:tools/git_sha.py
lib_deps =
	tzapu/WiFiManager@^2.0.17
	lvgl/lvgl@9.3.0
build_flags =
	-DLV_CONF_INCLUDE_SIMPLE

; ARDUINO_USB_CDC_ON_BOOT is per board, not per project, because it depends on what
; is wired to the USB connector:
;
;   - The 7-inch board has the ESP32-S3's own USB on the connector (it shows up as
;     "USB_JTAG_serial_debug_unit"), so Serial has to be the native USB. Without the
;     flag it is the hardware UART on GPIO 43/44, which leads nowhere there, and the
;     boot log carries only the lines the ESP-IDF log system writes itself
;     ("Wire.cpp:499", "sd_diskio") and not one line of the project's own.
;   - The 4848S040 has a CH343 USB-UART on the connector, wired to the ESP32's UART
;     pins. With the flag, Serial goes to the native USB, which this board does not
;     connect - and the panel goes completely silent while running perfectly well.
;
; So: the flag belongs in the environments of the boards whose connector is the
; native USB, and nowhere else.

[env:esp32-s3]
; German, the language the panel has always spoken. The standard build.
board = guition-esp32-s3-4848s040
board_build.partitions = partitions/16mb_app.csv
build_flags =
	${env.build_flags}
	-I include
	-DRCT_BOARD_GUITION_4848S040

[env:esp32-s3-en]
; The same firmware in English: display, web interface and SD status line all
; come from src/i18n/LangEn.cpp. One language per build, chosen here - there is
; no switch on the device, see src/i18n/Lang.h.
;
; Both builds write .pio/build/esp32-s3/firmware.bin under their own directory,
; so flashing the English one does not overwrite the German file. The language
; is part of the version line in the web interface, so the two can be told
; apart on a device that has both been flashed at some point.
extends = env:esp32-s3
build_flags =
	${env.build_flags}
	-I include
	-DRCT_BOARD_GUITION_4848S040
	-DRCT_LANG_EN=1

[env:esp32-s3-touch-lcd-7]
; The Waveshare ESP32-S3-Touch-LCD-7, 800 x 480. Its own board profile
; (src/board/waveshare_touch_lcd7/Pins.h) is the only difference to the Guition build
; besides the numbers PlatformIO needs; the board file is a copy of the Guition
; one because the two modules are the same part: ESP32-S3-WROOM-1-N16R8, 16 MB
; flash and 8 MB OPI PSRAM, which the vendor's wiki and its own troubleshooting
; note (flash 16 MB, PSRAM 8 MB OPI) both give.
;
; No "supported" in the name: the profile compiles, but nothing has run on the
; hardware yet. What is still open is written down in the profile - the relay pin,
; and whether the backlight mod puts GPIO 6 on the enable net alone or next to
; EXIO2.
board = waveshare-esp32-s3-touch-lcd-7
board_build.partitions = partitions/16mb_app.csv
build_flags =
	${env.build_flags}
	-I include
	-DRCT_BOARD_WAVESHARE_TOUCH_LCD7
	; The connector on this board is the ESP32-S3's own USB, so the log has to go
	; there - see the note where the flag is introduced.
	-DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-touch-lcd-7-en]
; The 7-inch board in English, as env:esp32-s3-en is for the Guition.
extends = env:esp32-s3-touch-lcd-7
build_flags =
	${env.build_flags}
	-I include
	-DRCT_BOARD_WAVESHARE_TOUCH_LCD7
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DRCT_LANG_EN=1