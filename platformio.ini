; PlatformIO Project Configuration File
;
; rct-panel - RCT Power data panel on the Guition ESP32-S3 4848S040
; (480x480 ST7701 RGB display + GT911 touch, 16 MB flash / 8 MB PSRAM)
;
; Stack: Arduino-ESP32 core 3.x (ESP-IDF 5.3) + esp_lcd RGB panel + LVGL 9
;        + WiFiManager captive portal for Wi-Fi/RCT configuration.

[platformio]
description = RCT Power wall panel (Guition ESP32-S3-4848S040)

[env]
framework = arduino
platform = espressif32@6.8.0
monitor_speed = 115200
lib_deps =
	tzapu/WiFiManager@^2.0.17
	lvgl/lvgl@9.3.0
build_flags =
	-DLV_CONF_INCLUDE_SIMPLE

[env:esp32-s3]
; German, the language the panel has always spoken. The standard build.
board = guition-esp32-s3-4848s040
board_build.partitions = partitions/16mb_app.csv
build_flags =
	${env.build_flags}
	-I include
	-DRCT_BOARD_GUITION_4848S040

[env:esp32-s3-en]
; The same firmware in English: display, web interface and SD status line all
; come from src/i18n/LangEn.cpp. One language per build, chosen here - there is
; no switch on the device, see src/i18n/Lang.h.
;
; Both builds write .pio/build/esp32-s3/firmware.bin under their own directory,
; so flashing the English one does not overwrite the German file. The language
; is part of the version line in the web interface, so the two can be told
; apart on a device that has both been flashed at some point.
extends = env:esp32-s3
build_flags =
	${env.build_flags}
	-I include
	-DRCT_BOARD_GUITION_4848S040
	-DRCT_LANG_EN=1